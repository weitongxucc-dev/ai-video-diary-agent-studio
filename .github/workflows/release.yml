name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Build jobs (one per architecture, no publishing) ──────────────

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      # ── Architecture guard ────────────────────────────────────

      - name: Verify runner architecture
        run: |
          EXPECTED="${{ matrix.arch }}"
          ACTUAL=$(uname -m)
          echo "Target arch: $EXPECTED"
          echo "Runner arch: $ACTUAL"
          case "$EXPECTED" in
            arm64) [ "$ACTUAL" = "arm64" ] || { echo "::error::Expected arm64 runner, got $ACTUAL"; exit 1; } ;;
            x64)   [ "$ACTUAL" = "x86_64" ] || { echo "::error::Expected x64 runner, got $ACTUAL"; exit 1; } ;;
          esac
          echo "Architecture guard passed: $ACTUAL matches $EXPECTED"

      # ── Runtimes ─────────────────────────────────────────────

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # ── Version guard ────────────────────────────────────────

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing version $PKG_VERSION"

      # ── Build ────────────────────────────────────────────────

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend (Next.js standalone)
        run: pnpm --dir apps/web build

      - name: Build API binary (PyInstaller — ${{ matrix.arch }})
        run: |
          cd apps/api
          uv sync --group dev
          .venv/bin/pyinstaller pyinstaller.spec \
            --distpath ../desktop/dist \
            --workpath ../desktop/build-api \
            --clean --noconfirm

      - name: Verify API binary architecture
        run: |
          API_BIN=apps/desktop/dist/api-server
          echo "API binary info:"
          file "$API_BIN"
          EXPECTED="${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          if ! file "$API_BIN" | grep -q "$EXPECTED"; then
            echo "::error::API binary architecture mismatch: expected $EXPECTED"
            exit 1
          fi
          echo "API binary architecture verified: $EXPECTED"

      # ── Package (no publish) ─────────────────────────────────

      - name: Package macOS app (${{ matrix.arch }})
        run: |
          cd apps/desktop
          npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Collect release assets
        run: |
          mkdir -p assets-${{ matrix.arch }}
          shopt -s nullglob
          assets=(apps/desktop/dist/*.dmg apps/desktop/dist/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No DMG or ZIP assets were produced for ${{ matrix.arch }}"
            exit 1
          fi
          cp "${assets[@]}" assets-${{ matrix.arch }}/
          echo "Assets for ${{ matrix.arch }}:"
          ls -la assets-${{ matrix.arch }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.arch }}
          path: assets-${{ matrix.arch }}/

  # ── Publish job (single, unified release) ─────────────────────

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download arm64 assets
        uses: actions/download-artifact@v4
        with:
          name: assets-arm64
          path: assets/

      - name: Download x64 assets
        uses: actions/download-artifact@v4
        with:
          name: assets-x64
          path: assets/

      - name: List all assets
        run: |
          echo "All release assets:"
          ls -la assets/

      - name: Generate latest-mac.yml
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          export VERSION
          node -e "
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const assetsDir = 'assets';
          const files = fs.readdirSync(assetsDir);

          const arm64Zip = files.find(f => f.includes('arm64') && f.endsWith('.zip'));
          const x64Zip = files.find(f => f.includes('x64') && f.endsWith('.zip'));

          if (!arm64Zip || !x64Zip) {
            console.error('Missing zip files. Found:', files);
            process.exit(1);
          }

          function hashFile(name) {
            const buf = fs.readFileSync(path.join(assetsDir, name));
            return crypto.createHash('sha512').update(buf).digest('base64');
          }

          function sizeFile(name) {
            return fs.statSync(path.join(assetsDir, name)).size;
          }

          const yml =
            'version: ' + process.env.VERSION + '\n' +
            'files:\n' +
            '  - url: ' + arm64Zip + '\n' +
            '    sha512: ' + hashFile(arm64Zip) + '\n' +
            '    size: ' + sizeFile(arm64Zip) + '\n' +
            '  - url: ' + x64Zip + '\n' +
            '    sha512: ' + hashFile(x64Zip) + '\n' +
            '    size: ' + sizeFile(x64Zip) + '\n' +
            'path: ' + arm64Zip + '\n' +
            'sha512: ' + hashFile(arm64Zip) + '\n' +
            'releaseDate: ' + new Date().toISOString().replace(/\.\d{3}Z\$/, '.000Z') + '\n';

          const outPath = path.join(assetsDir, 'latest-mac.yml');
          fs.writeFileSync(outPath, yml);
          console.log('Generated latest-mac.yml:');
          console.log(fs.readFileSync(outPath, 'utf8'));
          "

      - name: Verify latest-mac.yml exists and is valid
        run: |
          if [ ! -f assets/latest-mac.yml ]; then
            echo "::error::latest-mac.yml was not generated"
            exit 1
          fi
          echo "latest-mac.yml size: $(wc -c < assets/latest-mac.yml) bytes"
          echo "--- content ---"
          cat assets/latest-mac.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
