name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      # ── Architecture guard ────────────────────────────────────

      - name: Verify runner architecture
        run: |
          EXPECTED="${{ matrix.arch }}"
          ACTUAL=$(uname -m)
          echo "Target arch: $EXPECTED"
          echo "Runner arch: $ACTUAL"
          case "$EXPECTED" in
            arm64) [ "$ACTUAL" = "arm64" ] || { echo "::error::Expected arm64 runner, got $ACTUAL"; exit 1; } ;;
            x64)   [ "$ACTUAL" = "x86_64" ] || { echo "::error::Expected x64 runner, got $ACTUAL"; exit 1; } ;;
          esac
          echo "Architecture guard passed: $ACTUAL matches $EXPECTED"

      # ── Runtimes ─────────────────────────────────────────────

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      # ── Version guard ────────────────────────────────────────

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing version $PKG_VERSION"

      # ── Build ────────────────────────────────────────────────

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend (Next.js standalone)
        run: pnpm --dir apps/web build

      - name: Build API binary (PyInstaller — ${{ matrix.arch }})
        run: |
          cd apps/api
          uv sync --group dev
          .venv/bin/pyinstaller pyinstaller.spec \
            --distpath ../desktop/dist \
            --workpath ../desktop/build-api \
            --clean --noconfirm

      - name: Verify API binary architecture
        run: |
          API_BIN=apps/desktop/dist/api-server
          echo "API binary info:"
          file "$API_BIN"
          EXPECTED="${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          if ! file "$API_BIN" | grep -q "$EXPECTED"; then
            echo "::error::API binary architecture mismatch: expected $EXPECTED"
            exit 1
          fi
          echo "API binary architecture verified: $EXPECTED"

      # ── Package & Publish ────────────────────────────────────

      - name: Package and publish macOS app (${{ matrix.arch }})
        run: |
          cd apps/desktop
          npx electron-builder --mac --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
