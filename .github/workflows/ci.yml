name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Run Ruff
        working-directory: apps/api
        run: uvx "ruff==0.15.7" check .

  backend:
    name: Backend (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install FFmpeg
        run: |
          # Keep package downloads on Ubuntu's HTTPS archive, outside the Azure mirror.
          # New runner images select mirrors through this file rather than a direct URI.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Setup Pi runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Pi SDK
        run: npm install --global @earendil-works/pi-coding-agent@1.5.0

      - name: Run backend tests
        working-directory: apps/api
        run: uv run python ../../scripts/run-backend-tests.py --suite portable --shard "${{ matrix.shard }}" --total 4 --junitxml "$RUNNER_TEMP/backend-tests/junit-${{ matrix.shard }}.xml"

      - name: Upload backend test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-tests/junit-${{ matrix.shard }}.xml
          if-no-files-found: error

  backend-darwin:
    name: Backend native macOS
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install FFmpeg
        run: |
          brew install ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Run native backend tests
        working-directory: apps/api
        run: uv run python ../../scripts/run-backend-tests.py --suite darwin --shard 1 --total 1 --junitxml "$RUNNER_TEMP/backend-tests/junit-darwin.xml"

      - name: Upload native backend test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-darwin
          path: ${{ runner.temp }}/backend-tests/junit-darwin.xml
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Run editing CLI tests
        run: node --test scripts/yaohe.test.mjs

      - name: Install Node dependencies
        id: install
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint:web

      - name: Run Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test:web

      - name: Build Next.js app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build:web

      - name: Check workflow contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test:web-contract

      - name: Check pixel-style contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test:pixel-style

  desktop-syntax:
    name: Desktop syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check desktop JavaScript syntax
        run: |
          node --check apps/desktop/main.js
          node --check apps/desktop/preload.js
          node --check apps/desktop/scripts/bundle-standalone.js

      - name: Check packaged Python entry-point syntax
        run: python -m py_compile apps/api/server.py
