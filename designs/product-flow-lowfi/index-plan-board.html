#225987;font-weight:500}.ico{width:16px;text-align:center;color:#687b89;font-size:15px}.taskbtn{display:block;padding:8px 10px}.taskbtn strong{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.taskbtn small{display:block;color:#7c8791;font-size:11px;margin-top:3px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#fff}.main-head{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 23px;border-bottom:1px solid var(--line)}h1{font-size:22px;line-height:1.2;margin:0;font-weight:500}.main-actions{display:flex;align-items:center;gap:8px}.content{min-height:0;flex:1;overflow:auto;padding:20px 24px 24px}.inspector{min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;background:#fbfcfd}.ins-head{height:58px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:500;flex:none}.ins-body{padding:16px 18px;overflow:auto;min-height:0}.close{border:0;background:transparent;font-size:18px;color:#82909c}.row{display:flex;align-items:center;gap:8px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.small{font-size:12px}.pill{border:1px solid #c9d5de;background:#f6f9fb;border-radius:20px;padding:3px 8px;font-size:12px;white-space:nowrap}.section{margin:0 0 20px}.section-title{font-size:13px;font-weight:500;margin:0 0 10px}.line{height:1px;background:var(--line);margin:16px 0}.field{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #e6ebee;font-size:13px}.field span:first-child{color:var(--muted)}.field strong{font-weight:500;text-align:right}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #d6dfe5;border-radius:9px;padding:12px;text-align:left;color:#293742;min-width:0}.card:hover,.list-item:hover{border-color:#9eb7c9;background:#fafcfe}.card.active,.list-item.active{border-color:#4380ad;box-shadow:0 0 0 2px #e5f1fa}.card strong{font-weight:500}.card p{margin:6px 0 0;font-size:12px;color:#6f7c86;line-height:1.5}.placeholder{background:repeating-linear-gradient(135deg,#e3e8ec,#e3e8ec 10px,#eef1f3 10px,#eef1f3 20px);border:1px solid #d6dfe4;display:grid;place-items:center;color:#74838e;font-size:12px}.thumb{height:90px;border-radius:5px;margin-bottom:10px}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}.search{height:34px;min-width:180px;flex:1;border:1px solid #cbd5dc;border-radius:7px;padding:0 11px;background:#fff;color:#34434d}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-20px -24px 18px;padding:0 24px;height:44px;align-items:stretch}.tab{border:0;background:transparent;border-bottom:2px solid transparent;color:#697783;padding:0 12px}.tab.active{color:#2e6898;border-bottom-color:#4382b4;font-weight:500}.list{display:grid;gap:8px}.list-item{width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;color:#2e3b46}.list-item strong{font-weight:500}.list-item p{font-size:12px;color:#74818b;margin:5px 0 0}.micro{font-size:11px;color:#85919b}.blank{border:1px dashed #c8d3db;border-radius:9px;padding:20px;color:#6d7b85;font-size:13px}.home{display:flex;flex-direction:column;height:100%;min-height:0}.chat-head{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);font-weight:500}.home .thread{padding:20px 17px}.home .bubble{max-width:100%}.home .proposal{max-width:100%}.home .composer{padding:12px 14px 16px}.compact-board{display:none}.board-lead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.board-title{font-size:18px;font-weight:500}.board-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,.8fr);gap:14px}.board-panel{border:1px solid var(--line);border-radius:9px;background:#fff;padding:15px;min-width:0}.board-panel h2{font-size:14px;font-weight:500;margin:0 0 9px}.board-panel p{font-size:12px;color:var(--muted);line-height:1.5}.board-preview{height:134px;border-radius:6px;margin-bottom:10px}.board-recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.board-recent .list-item{height:100%}.board-foot{font-size:12px;color:var(--muted);margin-top:10px}.thread{padding:25px 30px;min-height:0;flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px}.bubble{max-width:80%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;line-height:1.55}.bubble.me{align-self:flex-end;background:#edf5fa;border-color:#d6e6f0}.bubble.ai{align-self:flex-start;background:#fff}.speaker{display:block;color:#7a8791;font-size:11px;margin-bottom:5px}.proposal{border:1px solid #bfd3e2;background:#f7fbfe;border-radius:9px;padding:14px;max-width:560px}.proposal strong{font-weight:500}.proposal p{color:#6e7c87;font-size:12px;line-height:1.5}.composer{padding:12px 24px 18px;border-top:1px solid var(--line);background:#fff}.compose-input{width:100%;height:76px;border:1px solid #b9c8d2;border-radius:10px;padding:12px;resize:none;font:inherit}.compose-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.kpi{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e6ecef}.kpi strong{font-weight:500}.progress{height:4px;border-radius:3px;background:#dce5eb;margin:9px 0}.progress span{display:block;height:100%;background:#5184ad;border-radius:3px}.stage{display:flex;overflow:auto;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;flex:none}.stage button{height:42px;border:0;border-bottom:2px solid transparent;background:none;color:#75838e;white-space:nowrap;font-size:12px;padding:0 9px}.stage button.active{border-bottom-color:#3978aa;color:#2c6694;font-weight:500}.task-main{padding:14px 22px;overflow:auto;flex:1;min-height:0}.task-main .content{padding:0}.stage-canvas{border:1px solid #d5dfe5;border-radius:9px;padding:15px;margin-bottom:12px}.video{height:min(40vh,280px);min-height:180px;background:#343e47;border-radius:6px;display:grid;place-items:center;position:relative;color:#e0e7ea}.vertical{height:88%;aspect-ratio:9/16;border:1px dashed #a8b3bb;background:#53616b;display:grid;place-items:center;text-align:center;font-size:12px}.time{position:absolute;bottom:9px;right:11px;font-size:11px}.video-controls{height:36px;display:flex;align-items:center;gap:12px;font-size:12px;color:#687783}.rail{height:4px;flex:1;background:#dbe3e8;position:relative}.rail:before{content:"";height:100%;width:var(--pct,35%);position:absolute;background:#4c81ad}.shots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.shot{min-width:0;padding:5px;border:1px solid #cdd8df;border-radius:6px;background:#fff;text-align:left}.shot.active{border-color:#4b86b0;box-shadow:0 0 0 2px #e5f1f8}.shot .placeholder{height:56px;border:0;border-radius:3px}.shot strong{font-weight:500;font-size:11px;display:block;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{display:flex;align-items:center;gap:8px;margin:7px 0}.track label{font-size:12px;color:#71808b;width:36px}.track div{flex:1;min-width:0;height:27px;border:1px solid #d5dfe5;border-radius:4px;background:#f0f4f7;padding:5px 9px;color:#667782;font-size:11px}.task-compose{border-top:1px solid var(--line);padding:11px 20px 14px;flex:none}.scope{font-size:11px;color:#4c7798;margin-bottom:6px}.task-compose .compose-input{height:52px}.task-compose .compose-foot{margin-top:6px}.modal-wrap{display:none;position:fixed;inset:0;background:#15232f75;z-index:9;align-items:center;justify-content:center;padding:20px}.modal-wrap.show{display:flex}.modal{background:#fff;border-radius:12px;width:min(480px,100%);box-shadow:0 18px 48px #15232f40;border:1px solid #b8c6d0;overflow:hidden}.modal-head{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:500}.modal-body{padding:18px;line-height:1.6}.modal-foot{padding:10px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.drawer-toggle{display:none}.screen-note{font-size:11px;color:#82909a}.inspector.hidden{display:none}.layout.no-inspector{grid-template-columns:220px minmax(0,1fr)}
    @media(max-width:1279px){.layout,.layout.home-layout{grid-template-columns:200px minmax(0,1fr)}.inspector.home-board{width:min(620px,70vw)}.compact-board{display:flex;margin:0 17px 12px;border:1px solid #c8d9e5;border-radius:8px;background:#f7fbfe;padding:11px;align-items:center;gap:9px}.compact-board button{margin-left:auto}.side{grid-column:1}.main{grid-column:2}.inspector{position:fixed;right:0;top:54px;bottom:0;width:min(360px,42vw);z-index:6;background:#fff;box-shadow:-12px 0 30px #25364329;transform:translateX(110%);transition:transform .16s}.inspector.open{transform:translateX(0)}.layout.no-inspector{grid-template-columns:200px minmax(0,1fr)}.drawer-toggle{display:inline-flex}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:17px 20px}.tabs{margin:-17px -20px 17px;padding:0 20px}.brand{width:190px}}
    @media(max-width:1050px){.top{padding:0 10px}.layout,.layout.no-inspector,.layout.home-layout{grid-template-columns:182px minmax(0,1fr)}.brand{width:172px}.cards{gap:8px}.side{padding:9px 7px}.thread{padding:20px}.shots{gap:5px}}
    @media(max-width:1023px){.app{min-width:1024px}}@media(prefers-reduced-motion:reduce){.inspector{transition:none}}

<body>
<div class="app">
  <header class="top"><div class="brand"><span class="mark">▶</span>AI 视频日记</div><div class="crumb" id="crumb">首页</div><span class="tag">全产品低保真 · 演示数据</span><div class="right"><button class="btn ghost" id="flowBtn">流程图</button><button class="btn drawer-toggle" id="drawerBtn">看详情</button></div></header>
  <div class="layout" id="layout"><aside class="side"><button class="btn new" id="newBtn">＋ 开始新视频</button><div class="nav-label">功能</div><div id="nav"></div><div class="nav-label">创作任务 · 示例</div><button class="taskbtn" data-task="product"><strong>产品介绍</strong><small>剪辑中 · 等待看修改</small></button><button class="taskbtn" data-task="weekly"><strong>本周销售观察</strong><small>文案待确认</small></button><div class="side-bottom"><button class="navbtn" data-page="health"><span class="ico">◷</span>运行情况</button><button class="navbtn" data-page="settings"><span class="ico">⚙</span>设置</button></div></aside><section class="main" id="main"></section><aside class="inspector" id="inspector"><div class="ins-head"><span id="insTitle">任务执行</span><button class="close" id="insClose" aria-label="收起详情">×</button></div><div class="ins-body" id="insBody"></div></aside></div>
</div>
<div class="modal-wrap" id="modalWrap" role="dialog" aria-modal="true" aria-label="详情"><div class="modal"><div class="modal-head"><span id="modalTitle">详情</span><button class="close" id="modalClose" aria-label="关闭">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<script>
  const $=id=>document.getElementById(id);
  const nav=[['home','首页','⌂'],['materials','素材库','▣'],['knowledge','内容资料','▤'],['people','人物与声音','◉'],['templates','视频模板','▦'],['automation','自动任务','◷'],['publishing','发布与数据','↗']];
  const labels=Object.fromEntries(nav.map(x=>[x[0],x[1]]));Object.assign(labels,{task:'创作任务',health:'运行情况',settings:'设置'});
  const clips=[['开场','00:00–00:04'],['场景','00:04–00:12'],['口播','00:12–00:18'],['产品','00:18–00:34'],['结尾','00:34–00:48']];
  let state={page:'home',selected:null,task:'product',stage:'剪辑',shot:2,proposal:false,confirmedShot:null,tab:'知识库'};
  function btn(text,id='',kind=''){return `<button class="btn ${kind}" ${id?`id="${id}"`:''}>${text}</button>`}
  function head(title,actions=''){return `<div class="main-head"><h1>${title}</h1><div class="main-actions">${actions}</div></div>`}
  function card(name,sub,i,kind=''){return `<button class="card ${state.selected===kind+i?'active':''}" data-select="${kind+i}"><div class="placeholder thumb">${kind==='material'?'素材画面':kind==='person'?'人物预览':'内容示意'}</div><strong>${name}</strong><p>${sub}</p></button>`}
  function row(name,sub,i,kind){return `<button class="list-item ${state.selected===kind+i?'active':''}" data-select="${kind+i}"><div class="between"><strong>${name}</strong><span class="pill">${kind==='automation'?'规划示意':'查看'}</span></div><p>${sub}</p></button>`}
  function renderNav(){ $('nav').innerHTML=nav.map(([key,name,ico])=>`<button class="navbtn ${state.page===key?'active':''}" data-page="${key}"><span class="ico">${ico}</span>${name}</button>`).join('');document.querySelectorAll('[data-task]').forEach(el=>el.classList.toggle('active',state.page==='task'&&el.dataset.task===state.task))}
  function home(){return `<div class="home"><div class="chat-head"><span>AI 对话</span><span class="tiny">新视频 · 示例</span></div><div class="thread"><div class="tiny">说出目标，再到右侧看执行方案</div><div class="bubble me"><span class="speaker">我</span>用最近拍的产品视频，做一条 45 秒的介绍，语气自然一点。</div><div class="bubble ai"><span class="speaker">视频日记</span>找到可用画面。我先安排一条竖屏介绍：开场说清问题，再展示产品和使用场景。你可以在制作前调整露脸比例。</div><div class="bubble ai"><span class="speaker">这次需要你确认</span>方案已准备好。先核对素材和配音，再决定是否制作。</div><div class="compact-board"><span class="tiny">方案待确认 · 露脸 40% · 声音待选择</span><button class="btn" id="openBoard">看方案</button></div></div><div class="composer"><textarea class="compose-input" placeholder="说说你想做什么，例如：用本周拍的素材做一条产品介绍" aria-label="创作要求"></textarea><div class="compose-foot"><span class="tiny">示例不发送</span><button class="btn primary" disabled title="低保真示意">发送</button></div></div></div>`}
  function materials(){return `${head('素材库',btn('扫描目录','scanBtn','primary'))}<div class="content"><div class="toolbar"><input class="search" placeholder="找画面、人物、场景" aria-label="搜索素材"><button class="btn">全部</button><button class="btn">可用</button><button class="btn">待整理</button></div><div class="cards">${[['产品近景','00:12 · 3 个镜头 · 已整理'],['拍摄现场','00:28 · 5 个镜头 · 待整理'],['使用演示','00:19 · 4 个镜头 · 已整理'],['人物口播','00:32 · 1 个镜头 · 已整理'],['办公室环境','00:15 · 2 个镜头 · 已整理'],['包装细节','00:08 · 2 个镜头 · 待整理']].map((x,i)=>card(x[0],x[1],i,'material')).join('')}</div></div>`}
  function knowledge(){const source=state.tab==='信息源';return `${head('内容资料',btn(source?'新建来源':'添加资料','addKnowledge','primary'))}<div class="content"><div class="tabs"><button class="tab ${!source?'active':''}" data-tab="知识库">知识库</button><button class="tab ${source?'active':''}" data-tab="信息源">信息源</button></div><div class="toolbar"><input class="search" placeholder="${source?'找来源':'找资料、关键词'}" aria-label="搜索资料"><button class="btn">全部</button></div><div class="list">${(source?[['行业网站','最近检查 · 规划示意'],['短视频账号','尚未连接 · 规划示意'],['客户常见问题','本地整理 · 规划示意']]:[['产品说明','文档 · 版本 03 · 使用中'],['客户常见问题','文本 · 版本 02 · 使用中'],['品牌表达','文档 · 版本 01 · 使用中']]).map((x,i)=>row(x[0],x[1],i,source?'source':'knowledge')).join('')}</div></div>`}
  function people(){return `${head('人物与声音',btn('创建人物','addPerson','primary'))}<div class="content"><div class="tabs"><button class="tab active">人物</button><button class="tab">声音</button><button class="tab">发音词典</button></div><div class="cards">${card('我的形象','视频参考 · 中文 · 示例',0,'person')}${card('销售讲解','人物样本 · 待检查 · 示例',1,'person')}</div><div class="line"></div><div class="section-title">制作时选择</div><div class="blank">人物和声音在创作任务中按版本选用。这里仅展示页面层级，未连接真实档案。</div></div>`}
  function templates(){return `${head('视频模板',btn('查看我的模板','myTemplate','primary'))}<div class="content"><div class="tabs"><button class="tab active">我的模板</button><button class="tab">内置模板</button><button class="tab">版本记录</button></div><div class="cards">${card('产品介绍','竖屏 · 40 秒 · 版本 02 · 示例',0,'template')}${card('客户答疑','竖屏 · 30 秒 · 版本 01 · 示例',1,'template')}</div><div class="line"></div><div class="blank">模板保存制作选择，不复制上次的文案、成片或完成状态。选择版本后，为新主题生成独立任务。</div></div>`}
  function automation(){return `${head('自动任务',`<span class="tag">规划页面</span>`)}<div class="content"><div class="toolbar"><input class="search" placeholder="找任务" aria-label="搜索自动任务"><button class="btn" disabled>创建规则</button></div><div class="blank" style="margin-bottom:14px">本页展示目标结构。定时执行、通知和自动发布不能由低保真原型代表真实能力。</div><div class="list">${row('每周产品短片','模板 → 来源 → 审核 → 草稿 · 规划示意',0,'automation')}${row('客户问题合集','定期收集 → 待确认选题 · 规划示意',1,'automation')}</div></div>`}
  function publishing(){return `${head('发布与数据',`<span class="tag">先检查，再外发</span>`)}<div class="content"><div class="tabs"><button class="tab active">待输出</button><button class="tab">发布记录</button><button class="tab">表现数据</button></div><div class="list">${row('产品介绍','本地成片待检查 · 示例任务',0,'publish')}${row('客户答疑','尚在制作 · 示例任务',1,'publish')}</div><div class="line"></div><div class="blank">每个平台分别显示“本地导出、草稿、确认后发布”的真实可用状态。没有连接时不展示虚构的播放数据。</div></div>`}
  const stages=['资料','选题','文案','配音','人物','剪辑','字幕','输出'];
  function task(){const s=state.stage;const start=clips[state.shot][1].split('–')[0];const pct=Math.round((Number(start.slice(0,2))*60+Number(start.slice(3)))/48*100)+'%';let body='';if(s==='剪辑'){body=`<div class="stage-canvas"><div class="between" style="margin-bottom:9px"><strong>成片预览</strong><span class="tiny">竖屏 · 示例画面</span></div><div class="video"><div class="vertical">${state.confirmedShot===state.shot?'产品展示':'镜头 '+String(state.shot+1).padStart(2,'0')}<br>画面占位</div><span class="time">${start} / 00:48</span></div><div class="video-controls"><button class="btn ghost" disabled>▶</button><span>${start}</span><div class="rail" style="--pct:${pct}"></div><span>00:48</span></div></div><div class="stage-canvas"><div class="between" style="margin-bottom:10px"><strong>镜头</strong><span class="tiny">点选后，修改会指向该段</span></div><div class="shots">${clips.map((x,i)=>`<button class="shot ${i===state.shot?'active':''}" data-shot="${i}"><div class="placeholder">画面 ${i+1}</div><strong>${i+1}. ${state.confirmedShot===i?'产品展示':x[0]}</strong><span class="micro">${x[1]}</span></button>`).join('')}</div></div><div class="stage-canvas"><div class="track"><label>画面</label><div>镜头 01 ─ 镜头 02 ─ 镜头 03 ─ 镜头 04 ─ 镜头 05</div></div><div class="track"><label>配音</label><div>整条配音 · 时间范围示意</div></div><div class="track"><label>字幕</label><div>按句分段 · 与画面同步</div></div></div>`}else{const examples={资料:['已选资料','产品说明 / 客户常见问题','先确认本条视频可以使用哪些内容。'],选题:['选题候选','介绍这款应用解决什么问题','选择后进入文案。'],文案:['文案段落','开场 → 问题 → 产品 → 结尾','选中一段可对话修改，检查事实来源。'],配音:['配音版本','中文配音 · 发音待试听','试听后再确认，局部错误可只重做一句。'],人物:['人物与口型','露脸占比 40% · 高精度','只有露脸段制作口型，其余段保留配音。'],字幕:['字幕与封面','字幕逐句检查 · 封面待选','调整字幕样式和安全区。'],输出:['检查与输出','画面 / 声音 / 字幕 / 来源','确认后保存本地成片。']};const x=examples[s];body=`<div class="stage-canvas"><div class="between"><strong>${x[0]}</strong><span class="pill">示例状态</span></div><h2 style="font-size:18px;font-weight:500;margin:20px 0 8px">${x[1]}</h2><p class="muted">${x[2]}</p></div><div class="list">${['当前内容','引用来源','需要确认'].map((n,i)=>row(n,['可在此编辑与预览','只列实际使用的内容','确认后进入下一步'][i],i,'taskrow')).join('')}</div>`}return `${head(state.task==='product'?'产品介绍':'本周销售观察',`${btn('撤销','undoBtn')}${btn('版本 04','versionBtn')}`)}<div class="stage">${stages.map(x=>`<button class="${s===x?'active':''}" data-stage="${x}">${x}</button>`).join('')}</div><div class="task-main">${body}</div><div class="task-compose"><div class="scope">${s==='剪辑'?`当前范围：镜头 ${String(state.shot+1).padStart(2,'0')} · ${clips[state.shot][1]}`:`当前阶段：${s}`}</div><input class="compose-input" id="taskPrompt" placeholder="说说想怎么改，例如：把这里换成产品近景，保留配音" aria-label="修改要求"><div class="compose-foot"><span class="tiny">先看影响，再决定是否执行</span>${btn('看影响','previewBtn','primary')}</div></div>`}
  function simple(page){return `${head(labels[page])}<div class="content"><div class="blank">${page==='health'?'这里显示真实的后台任务、磁盘与模型运行情况。示例原型不伪造运行数据。':'设置按存储、模型、语言和平台连接分组。与当前对象无关的选项放在这里。'}</div></div>`}
  function inspector(){let title='',html='';const p=state.page,id=state.selected;if(p==='home'){title='任务执行';html=`<div class="board-lead"><div><div class="board-title">准备新视频</div><div class="tiny">产品介绍 · 方案待确认 · 示例</div></div><span class="pill">还没开始</span></div><div class="board-grid"><div class="board-panel"><h2>这次怎么做</h2><div class="field"><span>画面</span><strong>产品＋口播</strong></div><div class="field"><span>时长</span><strong>约 45 秒</strong></div><div class="field"><span>露脸</span><strong>40% 目标</strong></div><div class="field"><span>声音</span><strong>待选择</strong></div><p>确认前核对素材、人物声音和制作条件。</p><button class="btn primary" id="reviewPlan">看方案</button></div><div class="board-panel"><h2>可用素材 · 示例</h2><div class="placeholder board-preview">素材预览区</div><div class="field"><span>已整理</span><strong>产品近景、人物口播</strong></div><div class="field"><span>待整理</span><strong>拍摄现场</strong></div><button class="btn" id="boardMaterials" style="margin-top:12px">去素材库</button></div></div><div class="line"></div><div class="section-title">其他待办 · 示例</div><div class="board-recent"><button class="list-item" id="runningTask"><strong>产品介绍</strong><p>镜头替换等你确认</p></button><button class="list-item" id="waitingTask"><strong>本周销售观察</strong><p>文案等你确认</p></button></div><div class="board-foot">左侧切换并行任务；详情按需弹出。</div>`}else if(p==='task'){title=state.stage==='剪辑'?`镜头 ${String(state.shot+1).padStart(2,'0')}`:`${state.stage}详情`;html=state.stage==='剪辑'?`<div class="placeholder" style="height:138px;border-radius:6px">所选画面</div><div class="field"><span>成片位置</span><strong>${clips[state.shot][1]}</strong></div><div class="field"><span>画面</span><strong>${state.confirmedShot===state.shot?'产品展示':clips[state.shot][0]}</strong></div><div class="field"><span>配音</span><strong>保留</strong></div><div class="line"></div><div class="section-title">可调整</div><div class="row" style="flex-wrap:wrap">${btn('换素材','replaceBtn')}${btn('裁剪','cropBtn')}${btn('字幕','captionBtn')}</div><div class="line"></div><div class="tiny">精确修改与对话修改都先看影响。</div>`:`<div class="section-title">当前选择</div><div class="field"><span>阶段</span><strong>${state.stage}</strong></div><div class="blank" style="margin-top:14px">选中具体段落后，这里显示它的来源、设置和可执行动作。</div>`}else if(id){const parts=id.match(/^([a-z]+)(\d+)$/),kind=parts?.[1],n=Number(parts?.[2]||0);title={material:'素材详情',knowledge:'资料详情',source:'来源详情',person:'人物详情',template:'模板详情',automation:'规则详情',publish:'输出详情',taskrow:'当前对象'}[kind]||'当前对象';html=`<div class="placeholder" style="height:142px;border-radius:6px">${title}示意</div><div class="field"><span>对象</span><strong>${kind==='material'?['产品近景','拍摄现场','使用演示','人物口播','办公室环境','包装细节'][n]:kind==='template'?['产品介绍','客户答疑'][n]:kind==='person'?['我的形象','销售讲解'][n]:'所选条目'}</strong></div><div class="field"><span>来源</span><strong>演示数据</strong></div><div class="field"><span>状态</span><strong>仅用于讨论结构</strong></div><div class="line"></div><div class="tiny">正式页面需展示真实来源、版本、使用状态和可以采取的动作。</div>`}else{title='';html=''}$('insTitle').textContent=title;$('insBody').innerHTML=html;$('layout').classList.toggle('home-layout',p==='home');$('inspector').classList.toggle('home-board',p==='home');$('inspector').classList.toggle('hidden',!title);$('layout').classList.toggle('no-inspector',!title);if(!title)$('inspector').classList.remove('open')}
  function modal(title,body,actions=''){ $('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=actions||btn('知道了','modalDone');$('modalWrap').classList.add('show') }
  function closeModal(){ $('modalWrap').classList.remove('show') }
  function render(){renderNav();$('crumb').textContent='';$('main').innerHTML=({home,materials,knowledge,people,templates,automation,publishing,task})[state.page]?.()||simple(state.page);inspector()}
  document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.page){state.page=d.page;state.selected=null;render();return}if(d.task){state.page='task';state.task=d.task;state.stage=d.task==='weekly'?'文案':'剪辑';state.selected=null;render();return}if(d.select){state.selected=d.select;render();if(innerWidth<1280)$('inspector').classList.add('open');return}if(d.tab){state.tab=d.tab;state.selected=null;render();return}if(d.stage){state.stage=d.stage;render();return}if(d.shot){state.shot=Number(d.shot);state.proposal=false;render();return}switch(el.id){case'newBtn':state.page='home';render();break;case'flowBtn':modal('从素材到成片','<div class="field"><span>1</span><strong>素材进入固定目录，系统整理</strong></div><div class="field"><span>2</span><strong>对话说目标，看制作方案</strong></div><div class="field"><span>3</span><strong>确认文案、声音与画面</strong></div><div class="field"><span>4</span><strong>预览修改，检查并输出</strong></div><p class="tiny">模板、定时任务与平台发布是后续复用路径；此原型不代表全部已实现。</p>');break;case'reviewPlan':case'planBtn':modal('制作方案','<p>先显示可用素材、需要确认的声音、目标比例和可能重做的内容。用户确认后才建立新任务。</p><div class="field"><span>新任务</span><strong>独立制作，不复制旧结果</strong></div>');break;case'reviseBtn':document.querySelector('.compose-input')?.focus();break;case'openBoard':$('inspector').classList.add('open');break;case'boardMaterials':state.page='materials';state.selected=null;render();break;case'runningTask':case'waitingTask':modal(el.id==='runningTask'?'产品介绍':'本周销售观察','<p>任务详情在弹窗里查看。你可以回到对应制作步骤，也可以继续在中间对话修改。</p><div class="field"><span>当前</span><strong>等待人工确认 · 示例</strong></div>',`${btn('关闭','modalDone')}${btn('打开任务','openTask','primary')}`);break;case'openTask':closeModal();state.page='task';render();break;case'previewBtn':state.proposal=true;modal('修改预览',`<p>理解为：替换镜头 ${String(state.shot+1).padStart(2,'0')} 的画面，保留这段配音和字幕。</p><div class="field"><span>影响范围</span><strong>${clips[state.shot][1]}</strong></div><div class="field"><span>执行状态</span><strong>尚未执行 · 交互示意</strong></div>`,`${btn('取消','modalDone')}${btn('确认示意','confirmDemo','primary')}`);break;case'confirmDemo':state.confirmedShot=state.shot;closeModal();render();break;case'undoBtn':state.confirmedShot=null;render();break;case'drawerBtn':$('inspector').classList.add('open');break;case'insClose':$('inspector').classList.remove('open');break;case'modalClose':case'modalDone':closeModal();break;default:if(el.id)modal(el.textContent,'<p>这里只演示页面入口和布局。正式操作要接入当前项目的真实数据与执行能力。</p>')}});
  $('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body>
</html>
