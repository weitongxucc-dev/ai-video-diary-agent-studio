/* One shell for every right-side detail/operation card. */
:root{--floating-card-width:360px;--floating-card-height:min(560px,max(120px,calc(100vh - 208px)))}
.drawer{width:var(--floating-card-width);height:var(--floating-card-height);max-height:none;bottom:auto;border-radius:14px}
.context-card{width:var(--floating-card-width);height:var(--floating-card-height);max-height:none;border-radius:14px;display:flex;flex-direction:column}
.context-card>form{flex:1;height:100%;min-height:0;display:flex;flex-direction:column}
.drawerhead,.context-head{height:56px;min-height:56px;flex:none;padding:12px 16px}
.drawerbody,.context-body{padding:16px 20px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-gutter:stable}

const stat=(text,tone='',name)=>{const state=/需重新生成|旧版|不一致/.test(text)?'stale':/未开放|不可用|暂不支持/.test(text)?'unavailable':({success:'done',warning:'needs-you',danger:'failed',running:'running'}[tone]);return `<span class="status ${tone}" ${state?`data-state="${state}"`:''}>${state?stateIcon(state):name?icon(name):''}<span>${esc(text)}</span></span>`;};

function sourcesPage(){let v=view('sources','add');return `<div class="toolbar">${tabs('sources',[['add','添加资料'],['connectors','信息源'],['items','收集内容']])}<span class="spacer"></span>${button('返回知识库','nav',{attrs:'data-page="knowledge"',cls:'ghost',icon:'ArrowLeft'})}</div>${v==='add'?`<div class="form-width"><section class="settings-section">${head('导入文件')}<p class="small" style="margin-bottom:12px">支持纯文本、Markdown和有可读取文字的PDF。扫描件需要先提供文字版。</p>${button('选择文件','dialog',{attrs:'data-kind="knowledge-import"',icon:'Upload'})}</section><section class="settings-section">${head('保存网页')}<form data-form="web">${field('url','网页地址','',{placeholder:'https://example.com/article',required:true,type:'url',help:'保存当时的正文、原网址和获取时间，更新时另存版本。'})}${button('保存网页','submit',{icon:'Link2'})}</form></section><section class="settings-section">${head('添加文字')}<form data-form="text">${field('title','标题','',{placeholder:'给这份资料起一个名称',required:true})}${field('body','正文','',{textarea:true,rows:5,placeholder:'粘贴已有的产品说明、笔记或其他资料'})}${button('保存资料','submit',{icon:'Check'})}</form></section></div>`:v==='connectors'?`${notice('信息源逐一确认支持范围','不承诺所有网站通用抓取。当前可用能力以实际连接器为准。')}<div class="toolbar">${search('搜索信息源名称')}<span class="spacer"></span>${button('添加信息源','dialog',{attrs:'data-kind="connector"',icon:'Plus',cls:'primary'})}</div><div class="objectlist">${filterData([{id:'c1',title:'产品网站',description:'网页内容 · 手动获取 · 配置示例'},{id:'c2',title:'行业订阅',description:'订阅内容 · 能力待验证'}]).map(d=>objectrow(d.title,d.description,'connector',d.id,{icon:'Link2',trailing:stat('待验证','warning')})).join('')||noMatches()}</div>`:`${search('搜索收集内容')}<div class="objectlist section">${filterData(DOCS).map(d=>objectrow(d.title,'来源与保存版本分别保留','sourceitem',d.id,{icon:'FileText',trailing:'保存到知识库'})).join('')||noMatches()}</div>`}`;}


function settingsPage(){let v=view('settings','model');let body='';if(v==='model')body=`<form data-form="service" class="settings-section">${head('对话服务',`<div class="right">${stat(S.service==='configured'?'已配置·待验证':'未配置',S.service==='configured'?'warning':'')}</div>`)}<p class="small" style="margin-bottom:16px">用于聊天和写文案。默认只发送相关文字，不发送原视频。</p>${S.service==='configured'?notice('配置已保存到原型','还没有真实调用，不表示服务已经连接成功。'):notice('还未配置完整','选择已开通的服务，填写模型与连接密钥。')} ${prop('服务商',selectBtn(S.provider,'providers','选择服务商'))}${prop('模型',selectBtn(S.model,'models','选择模型'))}${prop('连接密钥',`<div style="max-width:360px"><input class="compact-input" name="key" aria-label="连接密钥" type="password" autocomplete="off" placeholder="原型请使用测试文字，不填写真实密钥"><p class="field-help">原型不会发送或保存真实密钥。</p></div>`)}<details class="thin-divider"><summary>连接详情</summary><div style="margin-top:12px">${field('address','连接地址','',{placeholder:'按实际服务填写',help:'配置页保留真实型号和地址；连接状态来自实际调用。'})}</div></details><div class="form-actions"><span class="form-error inline-error" role="alert"></span>${button('保存连接','submit',{cls:'primary'})}<small>保存后用于下一次对话和写稿。</small></div></form>`;
if(v==='production')body=`<form data-form="preferences" class="settings-section">${head('默认制作要求')}${prop('目标时长','<input class="compact-input" name="duration" aria-label="目标时长（秒）" type="number" min="15" max="600" value="60" style="width:100px"> 秒')}${prop('画面比例',choices('ratio',[['9:16','竖屏 9:16'],['16:9','横屏 16:9'],['1:1','方形 1:1']],S.ratio))}${prop('露脸占比',`<div class="flex"><input type="range" min="0" max="100" step="20" value="${S.share}" data-range="share" aria-label="露脸占比"><output data-output="share">${S.share}%</output></div>`)}${prop('口型精度',choices('quality',[['high','高精度'],['low','低精度']],S.quality))}<p class="field-help">目标占比与实际结果分别显示。不可用时保留选择，不自动改档。</p><div class="divider"></div>${field('brand','品牌名称','',{placeholder:'可选，用于封面和制作说明'})}<div class="form-actions">${button('保存要求','submit',{cls:'primary'})}</div></form>`;
if(v==='voices')body=`<section class="settings-section">${head('默认配音声音')}<div class="objectlist">${VOICES.map(d=>objectrow(d.name,d.note,'voice',d.id,{icon:'Volume2',trailing:tag(d.version,true)})).join('')}</div><div class="form-actions">${button('管理人物与声音','nav',{attrs:'data-page="profiles" data-view="voices"',icon:'ArrowRight'})}</div></section>`;
if(v==='paths')body=`<section class="settings-section">${head('保存位置')}${[['素材文件夹','原始视频、图片和音频'],['资料文件夹','导入资料与内容版本'],['成片文件夹','检查后保存的视频文件'],['模型与缓存','本地能力和下载缓存']].map(([n,d])=>`${prop(n,`<div class="flex"><span class="small">外接盘 / 视频日记 / ${n}（示例）</span>${ib('Folder','dialog','选择'+n,'data-kind="directory"')}</div>`)}<p class="field-help">${d}</p>`).join('')}<div class="form-actions">${button('保存位置','demo-save',{cls:'primary'})}</div></section>`;
if(v==='asr')body=`<section class="settings-section">${head('录音转文字')}${prop('处理方式',choices('asr',[['local','本地处理'],['cloud','云端处理']],S.asr))}${prop('语言',choices('language',[['zh','中文'],['en','英文']],S.language))}${prop('发音与专有词','保留原始文字，识别后可以核对。')}${S.asr==='cloud'?notice('云端处理会发送所选音频','使用前需说明已选服务、发送范围和实际费用。','','warning'):notice('本地处理','所选录音在本机处理。模型是否就绪以运行情况为准。')}<div class="form-actions">${button('保存设置','demo-save',{cls:'primary'})}${button('查看运行情况','nav',{attrs:'data-page="health"',cls:'ghost'})}</div></section>`;
if(v==='sources')body=`<section class="settings-section">${head('资料与信息源')}${prop('资料内容','在知识库查看正文、参数和出处。')}${prop('收集入口','在信息源中设置平台与获取规则。')}<div class="form-actions">${button('管理资料与信息源','nav',{attrs:'data-page="sources"',icon:'ArrowRight'})}</div></section>`;
return `<div class="toolbar">${tabs('settings',SETTINGS)}</div>${S.scenario==='error'?err():body}<div class="settings-section small"><div class="flex wrap">${button('隐私说明','dialog',{attrs:'data-kind="privacy"',cls:'ghost'})}${button('使用条款','dialog',{attrs:'data-kind="terms"',cls:'ghost'})}${button('开源许可','dialog',{attrs:'data-kind="licenses"',cls:'ghost'})}</div></div>`;}
function newPage(){return `<div class="form-width">${head('制作要求')}<p class="small" style="margin:8px 0 20px">填写这次要做什么，检查内容后创建任务。创建不等于开始制作。</p><form data-form="new">${field('goal','制作要求',S.goal,{textarea:true,rows:3,placeholder:'例如：用已有产品画面，做一条面向采购客户的介绍视频，重点讲操作简单。',required:true})}<div class="fieldgrid">${field('audience','观看对象','采购客户',{placeholder:'例如：第一次了解产品的客户'})}${field('duration','目标时长（秒）','60',{type:'number',min:15,max:600,required:true})}</div>${prop('画面比例',choices('ratio',[['9:16','竖屏 9:16'],['16:9','横屏 16:9'],['1:1','方形 1:1']],S.ratio))}<details class="thin-divider"><summary>更多要求</summary><div style="margin-top:12px">${prop('露脸占比',`<div class="flex"><input type="range" min="0" max="100" step="20" value="${S.share}" data-range="share" aria-label="目标露脸占比"><output data-output="share">${S.share}%</output></div>`)}${prop('口型精度',choices('quality',[['high','高精度'],['low','低精度']],S.quality))}${field('style','表达风格','自然、清楚、具体')}</div></details><div class="form-actions"><span class="form-error inline-error" role="alert"></span>${button('检查制作条件','submit',{cls:'primary',icon:'CircleCheck'})}<small>此原型仅展示检查与确认的界面顺序。</small></div></form>${S.preflight?`<section class="section preflight-summary">${head('检查结果 · 设计示例')}${prop('资料','产品使用指南 · 第3版')}${prop('素材','4份视频、1份图片')}${prop('声音','自然讲解 · 第2版')}${prop('对话服务',stat('真实能力需由服务检查'))}<div class="form-actions">${button('创建任务','create-demo-task',{cls:'primary',icon:'Plus'})}<small>保存要求，下一步选择选题。</small></div></section>`:''}</div>`;}
function taskPage(){let stage=S.stage;let body='';if(stage==='preparation')body=`<div class="stageintro"><div><h2>本次使用的内容</h2><p>先查看资料、素材与声音，再确认当前制作要求。</p></div>${button('修改要求','dialog',{attrs:'data-kind="requirements"',icon:'SlidersHorizontal'})}</div>${notice(S.scenario==='unavailable'?'还缺操作完成后的检查画面':'资料与画面示例','示例展示内容对应关系；真实数量、可用状态和引用由任务服务提供。',S.scenario==='unavailable'?button('补充素材','nav',{attrs:'data-page="library"'}):'','warning')}<section>${head('参考资料')}${DOCS.slice(0,2).map(d=>objectrow(d.title,'第'+d.version+'版 · '+d.source,'doc',d.id,{icon:'FileText'})).join('')}</section><section class="section">${head('可用画面')}<div class="grid">${MATERIALS.slice(0,3).map(mediaCard).join('')}</div></section><div class="form-actions">${button('确认使用','confirm-stage',{attrs:'data-next="topic"',cls:'primary'})}<small>确认实际内容后，再进入选题。</small></div>`;
if(stage==='topic')body=`<div class="stageintro"><div><h2>选择制作方向</h2><p>同一主题可以采用不同表达角度。</p></div>${button('生成选题','dialog',{attrs:'data-kind="generate-topics"',icon:'Sparkles',disabled:S.scenario==='unavailable'})}</div><div class="objectlist">${['把复杂操作讲清楚','三个步骤介绍产品用途','客户常见问题解答'].map((n,i)=>`<button type="button" class="objectrow" data-a="choose-topic" data-index="${i}"><span>${icon(S.topic===i?'CircleCheck':'Circle')}</span><span class="objectcopy"><strong>${n}</strong><span class="secondary">面向采购客户 · ${i===0?'教程演示':i===1?'产品介绍':'问题解答'} · 候选示例</span></span></button>`).join('')}</div><div class="form-actions">${button('确认选题','confirm-stage',{attrs:'data-next="script"',cls:'primary'})}</div>`;
if(stage==='script')body=`<div class="stageintro"><div><h2>文案正文</h2><p>3段 · 目标30秒 · 示例版本2</p></div>${button('保存到文案库','dialog',{attrs:'data-kind="save-script"',icon:'BookOpen'})}</div>${S.scenario==='unavailable'?notice('对话服务暂不可用','仍可编辑现有文案，重新生成需要恢复服务。','','warning'):''}${SEGMENTS.map((s,i)=>`<section class="script-segment"><span class="number">0${i+1}</span><div><div class="flex"><h3>${s.title}</h3><span class="flexspacer"></span><span class="small">${s.time}</span></div><textarea aria-label="第${i+1}段文案" data-script="${i}">${esc(S.script[i]||s.body)}</textarea><button type="button" class="cite" data-a="popover" data-kind="citation">${icon('FileText')}${s.cite}${icon('ChevronRight')}</button></div></section>`).join('')}<div class="form-actions">${button('确认文案','confirm-stage',{attrs:'data-next="narration"',cls:'primary'})}${button('撤销文案修改','undo-edit',{disabled:!EDIT_HISTORY.length,cls:'ghost'})}<small>正文变化时，对应配音和字幕需要重新制作。</small></div>`;
if(stage==='narration')body=`<div class="stageintro"><div><h2>本次配音</h2><p>声音档案与这条视频的配音分别保存。</p></div>${button('录音配音','dialog',{attrs:'data-kind="recording"',icon:'Mic'})}</div>${prop('使用声音',selectBtn(S.voice,'voices','选择配音声音'))}${prop('语言','中文')}${prop('文案','已确认文案 · 3段 · 示例')}<div class="divider"></div>${S.scenario==='empty'||S.scenario==='unavailable'?empty('还没有本次配音',S.scenario==='unavailable'?'配音能力暂不可用，请先查看运行情况。':'选好声音并确认文案后，再生成配音。',button('查看声音','nav',{attrs:'data-page="profiles" data-view="voices"'}),'AudioLines'):`<div class="objectlist">${SEGMENTS.map((s,i)=>objectrow('第'+(i+1)+'段 · '+s.title,s.time+' · 配音结果布局示例','audio',String(i),{icon:'AudioLines',trailing:'查看'})).join('')}</div><p class="small section">这里不绘制装饰性波形。真实配音接入后才能显示波形、试听和时长。</p>`}<div class="form-actions">${button('生成配音','dialog',{attrs:'data-kind="generate-narration"',cls:'primary',icon:'AudioLines',disabled:S.scenario==='unavailable'})}${button('下一阶段','task-stage',{attrs:'data-stage="person"',cls:'ghost'})}</div>`;
if(stage==='person')body=`<div class="stageintro"><div><h2>本次出镜</h2><p>仅为需要露脸的段落生成口型。</p></div>${button('选择人物','popover',{attrs:'data-kind="people"',icon:'UserRound'})}</div><div class="split-content"><div>${canvas('人物画面示意','不代表已生成口型',true)}</div><div>${prop('人物',S.person+' · 第2版')}${prop('声音',S.voice)}${prop('口型精度',choices('quality',[['high','高精度'],['low','低精度']],S.quality))}${prop('目标占比',`<div class="flex"><input type="range" min="0" max="100" step="20" value="${S.share}" data-range="share" aria-label="任务露脸占比"><output data-output="share">${S.share}%</output></div>`)}${prop('实际占比','尚无真实生成结果')}${S.share===0?notice('本阶段不需要出镜','全素材画面，不把跳过显示成完成。'):notice(S.scenario==='unavailable'?'人物口型暂不可用':'口型能力需实际检查','不可用时保留当前档位，不自动换模型。','','warning')}${button('生成口型','dialog',{attrs:'data-kind="generate-person"',cls:'primary',disabled:S.share===0||S.scenario==='unavailable'})}</div></div>`;
if(stage==='montage')body=montagePage();
if(stage==='subtitle')body=`<div class="toolbar">${tabs('subtitle',[['text','字幕'],['cover','封面']])}<span class="spacer"></span><small>修改立即更新，可撤销</small></div>${view('subtitle','text')==='text'?`<div class="toolbar">${choices('subtitleLanguage',[['zh','中文'],['en','英文'],['both','中英双语']],S.subtitleLanguage)}<span class="spacer"></span>${button('显示样式','detail',{attrs:'data-kind="subtitle" data-id="style"',icon:'SlidersHorizontal'})}</div><div class="objectlist">${SEGMENTS.map((s,i)=>`<div class="objectrow"><span class="time" style="width:85px">${s.time}</span><span class="objectcopy"><input class="compact-input" aria-label="第${i+1}条字幕" value="${esc(s.body)}" data-editable="subtitle"></span>${ib('MoreHorizontal','popover','字幕操作','data-kind="subtitle-actions"')}</div>`).join('')}</div><p class="small section">修改字幕文字不会自动改变配音。双语时间关联和译文需要分别核对。</p>`:`<div class="split-content"><div>${canvas('产品介绍','封面布局示意',true)}</div><div class="form-width">${field('coverTitle','封面标题','把操作讲清楚')}${prop('构图',choices('coverLayout',[['simple','简洁标题'],['image','画面与标题']],S.coverLayout))}${prop('安全区域','标题位于实际平台的可显示范围。')}<small>封面文字与版式立即更新草稿</small></div></div>`}`;
if(stage==='review')body=`<div class="stageintro"><div><h2>成片与检查</h2><p>生成、检查、保存分别记录。</p></div>${button('保存视频','dialog',{attrs:'data-kind="save-video"',cls:'primary',icon:'Download'})}</div>${S.scenario==='empty'||S.output==='missing'?empty('还未生成成片','先按当前剪辑生成成片，再预览和检查。',button('前往剪辑','task-stage',{attrs:'data-stage="montage"',icon:'ArrowRight'}),'Video'):`${S.output==='stale'?notice('剪辑已更新，需要重新生成','旧版结果不代表当前剪辑。',button('前往剪辑','task-stage',{attrs:'data-stage="montage"'}),'warning'):''}${canvas('成片预览布局','示例中没有真实媒体')}${playerbar()}<section class="section">${head('检查项目')}<div class="objectlist">${[['画面','黑帧、尾部截断、画面与文案是否相符'],['声音','截断、削波、配音表达和音量'],['字幕','文字、时间、遮挡与双语关联'],['封面','标题、尺寸和平台显示范围']].map(([n,d])=>`<div class="objectrow"><span class="mini-icon">${icon('Circle')}</span><span class="objectcopy"><strong>${n}</strong><span class="secondary">${d}</span></span>${stat('需真实检查')}</div>`).join('')}</div><div class="form-actions">${button('检查成片','dialog',{attrs:'data-kind="quality"',icon:'CircleCheck'})}${button('修改镜头','task-stage',{attrs:'data-stage="montage"',cls:'ghost'})}${button('保存为视频模板','dialog',{attrs:'data-kind="save-template"',cls:'ghost'})}</div></section>`}`;
if(stage==='publish')body=`${notice('暂不支持直接发布','可以先保存视频，再到平台上传。本地保存不计为已发布。','','warning')}<div class="stageintro"><div><h2>发布前内容</h2><p>仅展示将来操作的组织方式，不模拟发布成功。</p></div>${button('保存视频','dialog',{attrs:'data-kind="save-video"',icon:'Download'})}</div><div class="form-width">${field('title','发布标题','产品介绍：把操作讲清楚')}${field('description','发布说明','简要介绍产品用途与操作步骤。',{textarea:true})}${prop('目标平台',choices('platform',[['douyin','抖音'],['wechat','视频号'],['bilibili','B站']],S.platform))}${prop('目标账号',stat('未连接真实账号'))}${prop('可见范围','发布前确认具体账号与范围')}<div class="form-actions">${button('确认发布','unavailable',{cls:'primary',disabled:true})}<small>真实平台能力接通后才可执行。</small></div></div>`;
if(S.scenario==='error')body=err();if(S.scenario==='loading')body='<div class="skeleton"></div><div class="skeleton"></div>'+stat('正在读取当前任务','running');return `<div class="stagepane ${stage==='montage'?'montage-editor':''}" data-stage-screen="${stage}">${body}</div>`;}
function montagePage(){
 const stale=S.output==='stale',missing=S.output==='missing'||S.scenario==='empty',shot=SHOTS.find(x=>x.id===S.shot);
 const clip=(title,start,end,kind,attrs='')=>`<button type="button" class="tl-clip" data-track-kind="${kind}" style="--s:${start/30};--d:${(end-start)/30}" title="${esc(title)} · ${formatTimelineTime(start)}–${formatTimelineTime(end)}" ${attrs}>${esc(title)}</button>`;
 return `<div class="editor-toolbar toolbar"><span>${missing?'还未生成成片':stale?'草稿已更新 · 成片需重新生成':'当前剪辑示例'}</span><span class="small">${S.ratio} · 30秒</span><span class="spacer"></span>${button('撤销','undo-edit',{attrs:'aria-label="撤销编辑"',disabled:!EDIT_HISTORY.length})}${button('重做','redo-edit',{attrs:'aria-label="重做编辑"',disabled:!REDO_HISTORY.length})}${button('画面比例','popover',{attrs:'data-kind="ratio"'})}${button('生成成片','dialog',{attrs:'data-kind="generate-output"',cls:'primary',icon:'Video',disabled:S.scenario==='unavailable'})}</div>
 <div class="editor-main"><div class="editor-preview"><div class="editor-picture">${canvas(shot?'镜头0'+shot.id+' · '+shot.title:'选中画面轨中的镜头','视频占位 · 未加载真实媒体')}</div>${playerbar()}</div><section class="editor-reading"><div class="sectionhead"><h2>${shot?'镜头0'+shot.id+' · '+shot.title:'当前镜头'}</h2>${shot?button('镜头详情','detail',{attrs:`data-kind="shot" data-id="${shot.id}"`,cls:'ghost',icon:'SlidersHorizontal'}):''}</div><p>${shot?esc(shot.source):'在下方画面轨选择镜头，查看来源并调整草稿。'}</p>${shot?prop('时间范围',shot.start+'–'+shot.end):''}<div class="thin-divider"><small>对应文案 · 示例</small><p>${esc(SEGMENTS[shot?.id===1?0:shot?.id===4?2:1].body)}</p></div><p class="edit-hint">修改直接应用到草稿，可撤销。生成是单独的操作，不会因调整参数自动开始。</p>${stale?stat('成片需重新生成','warning'):''}</section></div>

function onboardingPage(){let n=S.onboarding;const content=[['账号与工作区','选择本人所属工作区，私人内容与团队共享分开。',field('workspace','工作区名称','我的工作区')],['选择保存位置','原始素材、资料与成片分别保存。',prop('保存位置',button('选择文件夹','dialog',{attrs:'data-kind="directory"',icon:'Folder'}))],['检查必要能力','以真实服务检查为准，不从配置填写推断成功。',prop('本地服务',stat('能力检查示例'))+prop('对话服务',stat('待验证','warning'))],['准备内容','可以先导入已有文件，也可以进入后再准备。',button('导入文件','dialog',{attrs:'data-kind="import"',icon:'Upload'})],['进入工作台','你可以新建视频，也可以先整理已有内容。',button('进入首页','nav',{attrs:'data-page="home"',cls:'primary',icon:'ArrowRight'})]][n];return `<div class="form-width"><div class="steps-inline">${['工作区','保存位置','能力','内容','完成'].map((s,i)=>`<button type="button" class="stepdot ${i===n?'active':''}" data-a="onboarding-step" data-step="${i}"><span class="num">${i+1}</span>${s}</button>`).join('')}</div><div class="progresssteps">${Array.from({length:5},(_,i)=>`<span class="${i<=n?'done':''}"></span>`).join('')}</div>${head(content[0])}<p class="small" style="margin:10px 0 24px">${content[1]}</p>${content[2]}<div class="form-actions">${n>0?button('上一步','onboarding-step',{attrs:`data-step="${n-1}"` }):''}${n<4?button('下一步','onboarding-step',{attrs:`data-step="${n+1}"`,cls:'primary'}):''}${n===3?button('稍后准备','onboarding-step',{attrs:'data-step="4"',cls:'ghost'}):''}</div></div>`;}
function componentsPage(){return `<div class="toolbar">${tabs('components',[['controls','控件'],['content','内容组件'],['overlays','浮层'],['tokens','视觉规范']])}<span class="spacer"></span><small>可展开、可切换的组件样例</small></div>${view('components','controls')==='tokens'?tokensPage():view('components','controls')==='overlays'?`<section class="spec-block">${head('按任务选择浮层')}<div class="flex wrap">${button('动作菜单','popover',{attrs:'data-kind="actions"',icon:'MoreHorizontal'})}${button('配置浮卡','popover',{attrs:'data-kind="display"',icon:'SlidersHorizontal'})}${button('引用预览','popover',{attrs:'data-kind="citation"',icon:'FileText'})}${button('对象详情','detail',{attrs:'data-kind="doc" data-id="d1"',icon:'PanelRight'})}${button('助手提案卡','dialog',{attrs:'data-kind="change"',icon:'CircleCheck'})}${button('快速跳转','command',{icon:'Search'})}</div><p>菜单240px，右侧配置320px，完整圆角详情360px。普通编辑直接应用、可撤销；扣费与删除保留确认。触发器靠近边缘时自动移位，不画溢出的尖角。</p></section><section class="spec-block">${head('弹窗的主次与影响')}<p>只有扣费、删除使用确认；普通字段修改不弹确认。助手提案是可编辑方案，应用到草稿后可撤销，不自动生成。</p>${button('删除确认样例','dialog',{attrs:'data-kind="delete"',cls:'danger',icon:'Trash2'})}</section>`:view('components','controls')==='content'?`<section class="spec-block">${head('两行对象 · 56px')}${objectrow('产品使用指南','PDF · 第3版 · 今天09:46','doc','d1',{icon:'FileText',trailing:tag('产品知识',true)})}${objectrow('较长的资料名称：关于客户常见问题、产品操作和服务范围的完整说明','长内容完整可在详情查看','doc','d2',{icon:'FileText',trailing:stat('需核对','warning')})}</section><section class="spec-block">${head('局部空状态与读取失败')}<div class="component-grid"><div class="component-sample">${empty('没有匹配的资料','清除筛选或换一个关键词。',button('清除筛选','reset-search'),'Search')}</div><div class="component-sample">${err()}</div></div></section><section class="spec-block">${head('网格承载有意义的预览')}<div class="grid">${doccard(DOCS[0])}${mediaCard(MATERIALS[0])}</div></section>`:`<section class="spec-block">${head('按钮 · 32px，高度一致、宽度随内容')}<div class="flex wrap">${button('生成确认示例','dialog',{attrs:'data-kind="generate-output"',cls:'primary'})}${button('次要操作','detail',{attrs:'data-kind="doc" data-id="d1"'})}${button('文字操作','command',{cls:'ghost'})}${button('不可用','unavailable',{disabled:true})}${ib('MoreHorizontal','popover','更多操作','data-kind="actions"')}</div></section><section class="spec-block">${head('搜索 · 不同范围，用不同入口')}<div class="component-grid"><div class="component-sample">${search('搜索当前页面内容','component')}<p>页面搜索：32px高，图标16px，输入后出现清空。</p></div><div class="component-sample">${button('搜索页面与创作任务','command',{icon:'Search'})}<p>全局跳转：⌘K，分组结果，键盘上下定位。不能冒充全设备全文搜索。</p></div></div></section><section class="spec-block">${head('标签、筛选和状态有不同职责')}<div class="flex wrap">${tag('产品知识')}${tag('来源：产品指南',true)}${button('仅视频 ×','reset-search',{cls:'filterchip'})}${stat('待确认','warning')}${stat('配音已生成','success')}${stat('整理中','running')}${stat('生成失败','danger')}</div></section><section class="spec-block">${head('小渐变只用于AI身份')}<div class="flex"><span class="ai-mark">${icon('Sparkles')}</span><span>生成提案的身份标记</span><span class="flexspacer"></span>${ib('Search','command','搜索仍为单色图标')}${ib('Settings','nav','设置仍为单色图标','data-page="settings"')}</div><p>普通搜索、设置、分类和状态图标保持单色。身份色不表示连接成功，也不表示质量通过。</p></section><section class="spec-block">${head('紧凑选择与属性行')}${prop('模型',selectBtn(S.model,'models','组件样例选择模型'))}${prop('显示摘要',sw('summary','显示摘要',S.summary))}${prop('口型精度',choices('quality',[['high','高精度'],['low','低精度']],S.quality))}</section>`}`;}
function tokensPage(){return `<section class="spec-block">${head('黑白灰表面与文字')}<div class="token-grid">${[['外壳','#EFEFF1'],['内容面','#FFFFFF'],['次级面','#F5F5F7'],['主文','#242426'],['辅文','#616169'],['边界','#DDDDE3'],['主动作','#172131']].map(([n,c])=>`<div class="token"><div class="swatch" style="background:${c}"></div><div class="copy">${n}<br>${c}</div></div>`).join('')}</div></section><section class="spec-block">${head('字体与密度')}<div class="objectlist">${[['正文与对话','苹方 · 13px / 21px / 400'],['短标题','14px / 20px / 500'],['辅助信息','12px / 18px / 400'],['两行对象','56px；正文不缩小'],['控件与菜单','32px；主动作约32–36px'],['外壳栏宽','左160px / 中320px；沿用当前设计']].map(([n,v])=>prop(n,v)).join('')}</div></section><section class="spec-block">${head('间距、圆角和阴影')}${prop('间距','4 / 8 / 12 / 16 / 24 / 32px')}${prop('圆角','控件8px · 面板10px · 浮层12px · 语义标签胶囊')}${prop('阴影','只给浮层和媒体；常驻区域靠分隔与表面建立层级')}${prop('动效','140ms轻过渡，减少动态效果时禁用动画')}</section>`;}
function lexiconPage(){let q=(S.search.lexicon||'').toLowerCase();let items=LEXICON.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));return `<div class="toolbar">${search('搜索名称、定义或易混词','lexicon')}<span class="spacer"></span><small>${items.length} / ${LEXICON.length}词条 · 候选底稿</small></div>${notice('供产品、设计、研发与助手共用','不是用户业务中的发音词典。候选表达与现行保留项已分别标明。')}<div class="tablewrap"><table class="table"><thead><tr><th>名称与类型</th><th>定义或结果</th><th>适用条件</th><th>避免混用</th></tr></thead><tbody>${items.map(r=>`<tr><td><strong>${esc(r['标准名'])}</strong><small>${esc(r['类型'])} · ${esc(r['采纳状态'])}</small><span class="code-label">${esc(r['概念键'])}</span></td><td>${esc(r['定义或结果'])}</td><td>${esc(r['适用条件与边界'])}</td><td>${esc(r['避免混用'])}</td></tr>`).join('')}</tbody></table></div>`;}
function catalogPage(){return `<div class="prose"><p><a href="README.md">旧版正在执行：先读v3增量变更与保留范围 ↗</a></p><h2>给编码线程的阅读入口</h2><p>本包是完整桌面界面的设计候选与交接材料。示例数据、媒体占位和状态切换均属于设计展示；没有连接真实服务、模型或用户数据。</p><p>先阅读README与命名评审，再逐页打开正常、空内容、读取失败、未开放等场景。把组件组合与对象语义落实到项目现有React、CSS Modules和业务接口中。</p></div><section class="section">${head('页面目录')}<div class="catalog-grid">${PAGES.filter(p=>p.id!=='catalog').map(p=>`<button type="button" class="catalog-tile" data-a="nav" data-page="${p.id}"><span class="flex">${icon(p.icon)}<strong>${p.name}</strong></span><small>${p.task}</small></button>`).join('')}</div></section><section class="section">${head('创作任务的九个阶段')}<div class="choice-row">${STAGES.map(([id,,name])=>button(name,'task-stage',{attrs:`data-stage="${id}"`})).join('')}</div></section><section class="section">${head('参考来源与吸收范围')}<div class="objectlist">${REFERENCE_LINKS.map(([n,url,t])=>`<a class="objectrow" href="${url}" target="_blank" rel="noreferrer"><span class="mini-icon">${icon('ExternalLink')}</span><span class="objectcopy"><strong>${n}</strong><span class="secondary">${t}</span></span>${icon('ArrowRight')}</a>`).join('')}</div><p class="small section">研究证据与来源日期见references。布局借鉴Linear的密度和浮层秩序；创作对话借鉴ChatCut；本包没有复制其品牌资产。</p></section>`;}

function learningPage(){const g=stateGuard('偏好记录',button('查看当前任务','task-stage',{attrs:'data-stage="script"',icon:'Video'}));return `<div class="toolbar">${tabs('learning',[['active','使用中的偏好'],['disabled','已停用'],['evidence','反馈记录']])}<span class="spacer"></span>${button('表达设置','nav',{attrs:'data-page="creator"',cls:'ghost'})}</div>${notice('不训练模型','真实产品把适用的反馈与修改偏好作为创作上下文。每条偏好可追溯、可停用。')}${g||view('learning','active')==='evidence'?`<div class="objectlist">${g||objectrow('产品介绍 · 第2段','修改反馈：少讲泛泛效果，补充具体操作。','task','script',{icon:'FileText'})}</div>`:`<div class="objectlist">${(view('learning','active')==='disabled'?!S.preferenceEnabled:S.preferenceEnabled)?objectrow('用具体操作说明用途','来自两次修改反馈 · 证据布局示例','preference','pf1',{icon:'FileText',trailing:stat(S.preferenceEnabled?'使用中 · 示例':'已停用 · 示例')}):empty('这个视图没有偏好记录','切换视图查看当前示例。','','FileText')}</div>`}<p class="small section">停用后保留证据；不能仅凭信心分数断言用户现在仍认可这条偏好。</p>`;}

function updateUndoToast(label){const p=$('#undo-toast');if(label&&$('.drawerfoot .small')){p.hidden=true;clearTimeout(undoNoticeTimer);$('.drawerfoot .small').textContent=label+' · 可撤销';return;}if(label){p.dataset.message=label;clearTimeout(undoNoticeTimer);p.hidden=false;undoNoticeTimer=setTimeout(()=>p.hidden=true,8000);}if(!p.hidden)p.innerHTML=`<span>${esc(p.dataset.message||'草稿已更新')}</span>${button('撤销','undo-edit',{attrs:'aria-label="撤销最近编辑"',disabled:!EDIT_HISTORY.length})}${button('重做','redo-edit',{attrs:'aria-label="重做最近编辑"',disabled:!REDO_HISTORY.length})}`;}

function hydrateEdits(){if(S.page!=='task')return;$$('#app .workscroll input:not([type=search]):not([type=password]),#app .workscroll textarea,#app .drawer input:not([type=search]),#app .drawer textarea,#context-card[data-kind=requirements] input,#context-card[data-kind=cover] input').filter(el=>!el.dataset.search).forEach(el=>{const key=editFieldKey(el);el.dataset.editKey=key;if(!(key in EDIT_VALUES))EDIT_VALUES[key]=el.value;else el.value=EDIT_VALUES[key];if(el.type==='range'&&el.nextElementSibling?.tagName==='OUTPUT')el.nextElementSibling.textContent=el.value+(el.dataset.range?'%':'');});}
function parseTimelineTime(input){const s=String(input).trim().replace(/：/g,':');if(/^\d+(\.\d+)?$/.test(s))return Number(s);const m=s.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);return m&&Number(m[2])<60?Number(m[1])*60+Number(m[2]):null;}

function commitEditField(el){if(!el.dataset.editKey||S.page!=='task'||el.value===EDIT_VALUES[el.dataset.editKey])return;if(!el.reportValidity())return;
 if(S.drawer?.kind==='shot'&&['start','end'].includes(el.name)){const shot=SHOTS.find(x=>x.id===Number(S.drawer.id)),value=parseTimelineTime(el.value),start=el.name==='start'?value:parseTimelineTime(shot.start),end=el.name==='end'?value:parseTimelineTime(shot.end);if(value===null||start>=end||end>30){el.setCustomValidity('请输入有效时间；开始须早于结束，范围为0到30秒。');el.reportValidity();return;} }
 const key=el.dataset.editKey,value=el.value,label=el.getAttribute('aria-label')||el.name;
 applyEdit('已修改'+label,()=>{EDIT_VALUES[key]=value;if(el.dataset.range)S[el.dataset.range]=Number(value);if(el.dataset.script!==undefined)S.script[Number(el.dataset.script)]=value;if(S.drawer?.kind==='shot'&&['start','end'].includes(el.name)){SHOTS.find(x=>x.id===Number(S.drawer.id))[el.name]=formatTimelineTime(parseTimelineTime(value));}},false);
 // Keep the active field and surrounding detail open; update render state on blur.
 render();updateUndoToast('已修改'+label);const fresh=$(`[data-edit-key="${CSS.escape(key)}"]`);fresh?.focus({preventScroll:true});
}

function openCommand(trigger){closePopover();rememberFocus(trigger||document.activeElement);$('#command').innerHTML=`<div class="command-search">${icon('Search')}<input aria-label="搜索页面与任务" placeholder="搜索页面与创作任务…" data-command autocomplete="off">${ib('X','close-command','关闭全局搜索')}</div><div id="command-results" class="command-results" role="listbox" aria-label="跳转结果"></div><footer class="command-foot"><span>↑ ↓ 选择</span><span>Enter 打开</span><span>Esc 关闭</span><span class="flexspacer"></span><span>只搜索原型页面与任务</span></footer>`;commandResults();$('#command').showModal();positionRightDialog($('#command'));$('[data-command]').focus();}
function validate(form){const required=$$('input[required],textarea[required]',form).find(x=>!x.value.trim());if(required){$('.inline-error',form)?.replaceChildren(document.createTextNode('请填写'+(required.closest('label')?.querySelector('span')?.textContent||'必填内容')+'。'));required.focus();return false;}const bad=$$('input',form).find(x=>!x.validity.valid);if(bad){$('.inline-error',form)?.replaceChildren(document.createTextNode('请检查输入格式或取值范围。'));bad.focus();return false;}return true;}
function formSubmit(form){if(form.closest('#dialog')&&$('#dialog').dataset.kind?.startsWith('stage-')){let next=$('#dialog').dataset.next;closeDialog();route('task',next);toast('进入下一阶段的设计示例，未保存实际确认状态。');return;}if(!validate(form))return;let fd=new FormData(form),type=form.dataset.form;if(type==='auth'){toast('这里只展示验证与反馈，没有登录、修改密码或存储输入。');form.reset();return;}if(type==='new'){S.goal=fd.get('goal');S.preflight=true;render();toast('制作条件的布局示例已展开，未进行真实检查。');}else if(type==='service'){if(!fd.get('key')||!fd.get('address')){ $('.inline-error',form).textContent='请填写测试密钥与连接地址，再查看保存状态。';return;}if(!/^https?:\/\//.test(fd.get('address'))){$('.inline-error',form).textContent='连接地址需以 http:// 或 https:// 开头。';return;}S.service='configured';render();toast('已展示配置保存状态；没有发送请求，也没有持久化密钥。');}else if(type==='dialog'){const kind=(form.closest('#context-card')||$('#dialog')).dataset.kind;if(kind==='expression')S.expressions.push(fd.get('name'));if(kind==='banned-word')S.bannedWords.push(fd.get('name'));if(kind==='change')applyEdit('应用助手修改提案',()=>{EDIT_VALUES['proposal']=S.messages.at(-1)||'调整选定镜头';},false);if(kind==='person')PEOPLE.push({id:'p'+(PEOPLE.length+1),name:fd.get('name'),version:'第1版',note:fd.get('description')||'人物示例',initial:'人'});if(kind==='voice')VOICES.push({id:'v'+(VOICES.length+1),name:fd.get('name'),version:'第1版',note:fd.get('description')||'声音示例',initial:'声'});if(kind==='save-script')SCRIPTS.push({id:'s'+(SCRIPTS.length+1),title:fd.get('name'),kind:'文案',category:fd.get('category')||'未分类',version:1,date:'刚刚 · 示例',description:'当前正文的示例快照',body:S.script.join('\n')||SEGMENTS.map(x=>x.body).join('\n'),source:'当前任务示例'});closeDialog();render();if(kind==='reuse-script'){S.goal=fd.get('goal');route('new');}else if(kind==='knowledge-import')route('knowledge');else if(kind==='import')route('library');else toast(kind==='change'?'已展示修改后的版本关系：旧成片需重新生成。':kind==='delete'?'已演示删除确认，没有删除任何真实内容。':'已展示确认结果；没有执行真实生成、上传、授权或写入。');}else if(type==='text'){if(!fd.get('body')?.trim()){toast('请填写正文。');return;}DOCS.push({id:'d'+(DOCS.length+1),title:fd.get('title'),kind:'文字',category:'未分类',version:1,date:'刚刚 · 示例',description:'原型中添加的文字',body:fd.get('body'),source:'原型输入，不持久化'});route('knowledge');toast('文字已加入本页示例，刷新后恢复初始内容。');}else if(type==='web'){toast('没有抓取网页。这里仅演示输入与确认，真实读取需连接器支持。');}else toast('原型已展示保存反馈；没有修改真实产品设置。');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,k=b.dataset.kind;const insideDialog=b.closest('dialog');if($('#command').open&&a!=='close-command')$('#command').close();if($('#floating').matches(':popover-open')&&!b.closest('#floating')&&a!=='popover')closePopover();
switch(a){case 'legal-jump':e.preventDefault();document.getElementById(b.dataset.target)?.scrollIntoView({block:'start'});break;case 'nav':if(b.dataset.view)S.views[b.dataset.page]=b.dataset.view;if(insideDialog)insideDialog.close();route(b.dataset.page);break;case 'task-stage':if(insideDialog)insideDialog.close();route('task',b.dataset.stage);break;case 'back':history.back();break;case 'toggle-nav':S.navClosed=!S.navClosed;render();break;case 'toggle-chat':S.chatClosed=!S.chatClosed;render();break;case 'tab':S.views[b.dataset.key]=b.dataset.value;if(b.dataset.key==='knowledge')S.filter='';render();break;case 'detail':closePopover();if(insideDialog)insideDialog.close();detail(k,b.dataset.id,b);break;case 'close-drawer':if(S.drawer){rememberFocus(drawerTrigger);S.drawer=null;render();restoreFocus();}else detail('page','',b);break;case 'dialog':openDialog(k,b);break;case 'close-dialog':closeDialog();break;case 'undo-edit':undoEdit();break;case 'redo-edit':redoEdit();break;case 'popover':openPopover(k,b);break;case 'menu-choice':menuChoice(k,b.dataset.value);break;case 'custom-model':{let v=$('[name="custom-model"]').value.trim();if(v)menuChoice('models',v);else toast('请填写实际型号。');break;}case 'command':openCommand(b);break;case 'close-command':$('#command').close();break;case 'choice':if(S.page==='task'&&!insideDialog&&!b.closest('#context-card[data-kind=display]')){if(b.closest('#context-card'))b.parentNode.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b);});applyEdit('修改'+b.dataset.key,()=>S[b.dataset.key]=b.dataset.value);break;}if(S.page==='new')S.preflight=false;S[b.dataset.key]=b.dataset.value;if(b.closest('#dialog')){b.parentNode.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b);});}else if(b.closest('#context-card')){b.parentNode.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b);});render();positionContext();}else if(b.closest('#floating')){closePopover();render();}else render();break;case 'toggle':if(S.page==='task'&&b.closest('.drawer')){applyEdit('修改'+b.getAttribute('aria-label'),()=>S[b.dataset.key]=!S[b.dataset.key]);break;}S[b.dataset.key]=!S[b.dataset.key];b.setAttribute('aria-checked',S[b.dataset.key]);if(b.closest('#floating')||b.closest('#context-card'))applyDisplay();break;case 'mode':S.mode=S.mode==='grid'?'list':'grid';render();break;case 'clear':S.search[b.dataset.scope]='';render();$(`[data-search="${b.dataset.scope}"]`)?.focus();break;case 'reset-search':S.search.page='';S.filter='';S.scenario='normal';render();break;case 'retry':S.scenario='normal';render();toast('已回到正常布局示例；没有真实重试服务。');break;case 'tag-filter':route('library');S.filter=b.dataset.value;render();break;case 'suggest':$('[data-composer]').value=b.dataset.text;$('.send').disabled=false;$('[data-composer]').focus();break;case 'send':{let input=$('[data-composer]'),value=input.value.trim();if(!value)return;S.messages.push(value);if(S.page==='task')render();else {S.goal=value;route('new');}break;}case 'shot':S.shot=Number(b.dataset.id);render();break;case 'choose-topic':S.topic=Number(b.dataset.index);render();break;case 'confirm-stage':route('task',b.dataset.next);toast('已进入下一阶段示例；没有持久化业务确认。');break;case 'create-demo-task':route('task','topic');toast('进入任务设计示例，没有创建后台任务。');break;case 'remove-expression':S.expressions.splice(Number(b.dataset.index),1);render();break;case 'remove-word':S.bannedWords.splice(Number(b.dataset.index),1);render();break;case 'preference-toggle':S.preferenceEnabled=!S.preferenceEnabled;render();toast('已切换偏好状态示例，历史证据保留。');break;case 'welcome-step':S.welcomeStep=Number(b.dataset.step);render();break;case 'onboarding-step':S.onboarding=Number(b.dataset.step);render();break;case 'use-profile':if(S.page==='task'){applyEdit('更换'+(k==='voice'?'声音':'人物'),()=>{S[k]=b.dataset.name;S.drawer=null;});}else{S[k]=b.dataset.name;S.drawer=null;render();}toast('已选用档案示例；实际版本与授权需重新核对。');break;case 'template-new':{let t=TEMPLATES.find(x=>x.id===b.dataset.id);S.ratio=t.ratio;S.goal='使用'+t.title+'模板制作新视频';route('new');break;}case 'media-boundary':toast('这里是媒体操作入口；原型没有真实视频、音频或录音能力。');break;case 'unavailable':toast('这项能力尚未接入。');break;case 'demo-save':toast('仅展示保存反馈，不修改真实数据。');break;case 'submit':{e.preventDefault();const f=b.closest('form');if(f){formSubmit(f);}break;}}
});
function applyDisplay(){document.documentElement.classList.toggle('hide-summary',!S.summary);document.documentElement.classList.toggle('hide-type',!S.showType);document.documentElement.classList.toggle('hide-version',!S.showVersion);document.documentElement.classList.toggle('hide-date',!S.showDate);}
document.addEventListener('input',e=>{let x=e.target;if(x.dataset.search){S.search[x.dataset.search]=x.value;if(!e.isComposing)render();}if(x.matches('[data-composer]'))$('.send').disabled=!x.value.trim();if(x.closest('[data-form="new"]')){S.preflight=false;$('.preflight-summary')?.remove();}if(x.dataset.range){if(!x.dataset.editKey)S[x.dataset.range]=Number(x.value);$$(`[data-output="${x.dataset.range}"]`).forEach(o=>o.textContent=x.value+'%');}if(x.dataset.adjust!==undefined)x.nextElementSibling.textContent=x.value;if(x.matches('[data-menu-search]'))$$('.menuitem',$('#floating')).forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(x.value.toLowerCase()));if(x.matches('[data-command]'))commandResults(x.value.trim());});
document.addEventListener('compositionend',e=>{if(e.target.dataset.search){S.search[e.target.dataset.search]=e.target.value;render();}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.matches('[data-form]'))formSubmit(e.target);});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.target.matches('input,textarea,[contenteditable=true]')){e.preventDefault();e.shiftKey?redoEdit():undoEdit();return;}if(e.key==='Escape'&&($('#dialog').open||$('#command').open))return;if(e.key==='Escape'){if($('#floating').matches(':popover-open')){e.preventDefault();closePopover();restorePopoverFocus();return;}if(!$('#context-card').hidden){e.preventDefault();closeContext();return;}}if(e.key==='Escape'&&S.drawer&&!$('#dialog').open&&!$('#command').open&&!$('#floating').matches(':popover-open')){rememberFocus(drawerTrigger);S.drawer=null;render();restoreFocus();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#command').open)$('#command').close();else openCommand();}if($('#command').open&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){e.preventDefault();let opts=$$('.command-option');if(e.key==='Enter')opts[commandIndex]?.click();else {commandIndex=(commandIndex+(e.key==='ArrowDown'?1:-1)+opts.length)%Math.max(1,opts.length);selectCommand();}}if($('#floating').matches(':popover-open')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();let opts=$$('button.menuitem:not([hidden])',$('#floating')),i=opts.indexOf(document.activeElement);opts[(i+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length]?.focus();}if(e.target.matches('[data-composer]')&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('.send').click();}});
$('#scenario').addEventListener('change',e=>{S.scenario=e.target.value;S.drawer=null;render();});$('#output-state').addEventListener('change',e=>{S.output=e.target.value;render();});$('#theme').addEventListener('click',()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#floating').addEventListener('toggle',e=>{if(e.newState==='closed'){popTrigger?.setAttribute('aria-expanded','false');if(document.activeElement===document.body&&popTrigger?.isConnected)popTrigger.focus();}});
['dialog','command'].forEach(id=>$('#'+id).addEventListener('close',()=>{restoreFocus();}));
window.addEventListener('hashchange',()=>{$('#undo-toast').hidden=true;parseRoute();S.drawer=null;render();});window.addEventListener('resize',()=>{positionContext();positionPopover();});parseRoute();render();
// Preview controls only: they do not start an agent, generation, or paid call.
let previewMotionTimer;
document.addEventListener('click',e=>{const b=e.target.closest('[data-boundary-mode],[data-motion-preview]');if(!b)return;clearTimeout(previewMotionTimer);document.documentElement.classList.remove('motion-demo');if(b.dataset.boundaryMode){document.documentElement.dataset.boundaries=b.dataset.boundaryMode;}else{document.documentElement.dataset.boundaries='soft';void document.documentElement.offsetWidth;document.documentElement.classList.add('motion-demo');previewMotionTimer=setTimeout(()=>{document.documentElement.classList.remove('motion-demo');const p=document.querySelector('[data-motion-preview]');p.setAttribute('aria-pressed','false');},4900);}document.querySelectorAll('[data-boundary-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.boundaryMode===document.documentElement.dataset.boundaries));document.querySelector('[data-motion-preview]').setAttribute('aria-pressed',!!b.dataset.motionPreview);});
// Same dimensions for detail and operation cards; the child is offset for depth.
function positionContext(){const c=$('#context-card');if(c.hidden)return;const w=$('.workspace')?.getBoundingClientRect();if(!w)return;const width=Math.min(360,w.width-40),height=Math.min(560,Math.max(120,innerHeight-208));c.style.width=width+'px';c.style.height=height+'px';c.style.left=(w.right-width-28)+'px';c.style.top=(w.top+(S.page==='task'?116:72)+32)+'px';c.style.maxHeight='none';}
// Keep native modal focus/cancel behavior while using the shared right-card geometry.
function positionRightDialog(d){if(!d.open)return;const w=$('.workspace')?.getBoundingClientRect()||{top:30,right:innerWidth,width:innerWidth},ctx=$('#context-card'),drawer=$('.drawer');const width=Math.min(360,w.width-32),height=Math.min(560,Math.max(120,innerHeight-208));let left=w.right-width-16,top=w.top+(S.page==='task'?116:72);if(!ctx.hidden){const r=ctx.getBoundingClientRect();left=r.right-width-12;top=parseFloat(ctx.style.top)+32;}else if(drawer){left=w.right-width-28;top+=32;}d.style.width=width+'px';d.style.height=height+'px';d.style.left=Math.max(8,left)+'px';d.style.top=Math.min(top,innerHeight-height-16)+'px';}

function closeDialog(){if($('#dialog').open){$('#dialog').close();return;}if(!$('#context-card').hidden)closeContext();}
window.addEventListener('resize',()=>{positionRightDialog($('#dialog'));positionRightDialog($('#command'));});
</script>
