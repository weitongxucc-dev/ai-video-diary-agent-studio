[project]
name = "ai-video-diary-agent-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pillow>=12.2.0",
  "tencentcloud-sdk-python>=3.1.103",
  "langgraph>=1.2.2",
  "python-multipart>=0.0.32",
  "pyjwt[crypto]>=2.8.0",
  "psutil>=7.0.0,<8.0.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
jianying = ["pyjianyingdraft>=0.2.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyinstaller",
]
